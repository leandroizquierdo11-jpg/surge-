name: Prueba de scroll

# Abre el lector de tira larga en un emulador de tablet, hace deslizamientos cortos y largos con
# tiempos de dedo realistas y mide fotograma a fotograma cómo los sigue la tira.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/eu/kanade/tachiyomi/ui/reader/viewer/**"
      - "app/src/debug/**"
      - "app/src/androidTest/**"
      - ".github/workflows/prueba-scroll.yml"

concurrency:
  group: prueba-scroll
  cancel-in-progress: true

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app y la prueba
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Probar en un emulador de tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e class surge.test.WebtoonScrollTest app.surge.dev.test/androidx.test.runner.AndroidJUnitRunner
            adb logcat -d -v raw -s SurgeScrollTest:I > resultados.txt
            cat resultados.txt

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-scroll
          path: resultados.txt
          if-no-files-found: ignore
