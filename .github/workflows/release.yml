name: Compilar y publicar

# Cada push a main se compila. Si la versión de app/build.gradle.kts (versionName) todavía no tiene
# release, se publica una nueva y la app la ofrece como actualización.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "La release v$version ya existe: solo se comprueba que compila."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta el secreto KEYSTORE_PASSWORD"
            exit 1
          fi
          {
            echo "storeFile=$GITHUB_WORKSPACE/keystore/surge.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=surge"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease -Penable-updater

          tag="${{ steps.version.outputs.tag }}"
          mkdir -p salida
          mv app/build/outputs/apk/release/app-universal-release.apk "salida/surge-$tag.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "salida/surge-arm64-v8a-$tag.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "salida/surge-armeabi-v7a-$tag.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: surge-${{ steps.version.outputs.tag }}
          path: salida/*.apk

      - name: Publicar release
        if: steps.version.outputs.publicar == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#v}"
          # Notas de la versión: su sección de CHANGELOG.md (las enseña la propia app al actualizar).
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notas.md
          gh release create "$tag" salida/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Surge $tag" \
            --notes-file notas.md
